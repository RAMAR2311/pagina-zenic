<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#fff1de" />
    <title>Oficina Zenic · Modo 2D Lite</title>
    <link rel="icon" href="/favicon.svg" />
    <link rel="stylesheet" href="./lite.css" />
  </head>
  <body class="lite">
    <!-- Vista 2D ligera (lite.ts): la oficina sin 3D para celulares o equipos ligeros. -->
    <header class="lite-bar">
      <label class="lite-floor" title="El piso actual: selecciona otro para ver sus agentes">
        <span class="lite-floor-label">Piso</span>
        <select id="floor" aria-label="Piso"></select>
      </label>
      <a id="to-3d" class="btn" href="/?3d=1" title="La oficina 3D inmersiva">🏢 3D</a>
    </header>
    <main class="lite-main">
      <p id="floor-meta" class="lite-meta"></p>
      <div id="elsewhere" class="lite-elsewhere hidden"></div>
      <h2 class="lite-h">Agentes & Equipo <span id="waiting-now" class="lite-waiting"></span></h2>
      <ul id="workers" class="lite-workers"></ul>
    </main>
    <nav class="lite-nav" aria-label="Oficina">
      <button id="btn-issues" class="btn" type="button">📌 Tareas <span class="n"></span></button>
      <button id="btn-pulls" class="btn" type="button">🔀 PRs <span class="n"></span></button>
      <button id="btn-queue" class="btn" type="button">📋 Cola <span class="n"></span></button>
      <button id="btn-new" class="btn primary" type="button">✨ Nueva tarea</button>
    </nav>
    <div id="toasts"></div>
    <div id="conn" class="conn hidden">Reconectando…</div>
    <div id="modal-root"></div>
    <script type="module" src="./lite.ts"></script>
  </body>
</html>
